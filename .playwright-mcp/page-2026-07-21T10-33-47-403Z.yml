                  - cell [ref=f11e358]:
                    - paragraph [ref=f11e359]: "Температурная шкала, в которой датчик сейчас выводит информацию о температуре на свой экран: °C или °F. Используйте только для датчиков с экраном, которые умеют показывать температуру в разных температурных шкалах"
