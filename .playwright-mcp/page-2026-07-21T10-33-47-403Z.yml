            - heading [level=2] [ref=f11e368]:
              - text: Пример описания модели датчика температуры и влажности
              - link [ref=f11e370] [cursor=pointer]:
                - /url: "#primer-opisaniya-modeli-datchika-temperatury-i-vlazhnosti"
            - paragraph [ref=f11e374]:
              - text: Модель описывается в соответствии со структурой
              - link "model" [ref=f11e375] [cursor=pointer]:
                - /url: /docs/ru/smarthome/c2c/model
              - text: . В примере описан датчик температуры и влажности, который умеет сообщать о температуре, влажности и атмосферном давлении. Также датчик сообщает о силе сигнала, уровне заряда батареи и разряжена ли батарея, имеет настройку чувствительности. Датчик оснащен экраном, умеет показывать на экране температуру в °C и °F.
            - paragraph [ref=f11e376]:
              - text: Кроме того, у модели
              - link "изменены" [ref=f11e377] [cursor=pointer]:
