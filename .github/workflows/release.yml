name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; each job asks for exactly what it needs.  The write
# token (contents: write) exists only in `publish`, which runs no third-party
# action — just the preinstalled gh CLI.
permissions:
  contents: read

jobs:
  # Gate: the full CI workflow must be green for the tagged commit before
  # anything is built, signed or published.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and sign
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by sigstore/gh-action-sigstore-python for keyless OIDC signing.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest.json version matches tag
        run: |
          MANIFEST_VERSION=$(jq -r .version custom_components/sberhome/manifest.json)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build HACS zip
        run: |
          cd custom_components/sberhome
          zip -r "${GITHUB_WORKSPACE}/sberhome.zip" . \
            -x "*__pycache__*" "*.pyc" "*.pyo"

      # Keyless signing via Sigstore (OIDC, no secrets).
      # sigstore-python v3.x writes the bundle as sberhome.zip.sigstore.json
      # (older v3.0.x wrote .sigstore — the name this workflow still listed,
      # so no release since carried its signature).  Verify with
      # `sigstore verify identity`.
      - name: Sign release artifact (sigstore)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: sberhome.zip

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            sberhome.zip
            sberhome.zip.sigstore.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release and uploading its assets.
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files

      # Pre-release by rule, not by list: the list named b1/b2/b3 only, so a
      # b4 tag would have gone out as stable and HACS would offer it to
      # everyone.  PEP 440 spells pre-releases aN / bN / rcN right after the
      # version (what scripts/bump_version.py produces); -alpha/-beta/-rc
      # are accepted for hand-made tags.
      - name: Decide whether this is a pre-release
        id: channel
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" =~ (a|b|rc)[0-9]+$ ]] || [[ "$tag" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is a pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is a stable release"
          fi

      # gh CLI instead of a third-party release action: nothing but GitHub's
      # own tooling ever holds the write token.  gh checks that both files
      # exist before it creates the release (the old fail_on_unmatched_files).
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}" \
            sberhome.zip \
            sberhome.zip.sigstore.json
