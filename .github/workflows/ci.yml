name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly drift catcher — picks up breakage from new HA releases,
  # plugin updates and OS-image rolls without waiting for a PR.
  # Off-hour minute (17) keeps us out of the :00 thundering herd.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  # Callable from release.yml so a tag cannot be published without the
  # same lint + test gate that guards main (a tag push does not match the
  # `push: branches` trigger above).
  workflow_call:

permissions:
  contents: read

env:
  UV_VERSION: "0.7.9"
  UV_SYSTEM_PYTHON: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install ruff
        run: uv pip install --constraint=.github/workflows/constraints.txt ruff
      - name: Ruff check
        run: ruff check custom_components/sberhome tests
      - name: Ruff format check
        run: ruff format --check custom_components/sberhome tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Must match python_version in [tool.mypy] (pyproject.toml).
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        # mypy needs Home Assistant installed for hass/entity/config_entries
        # types; it comes in via pytest-homeassistant-custom-component.
        run: |
          uv pip install --prerelease=allow --constraint=.github/workflows/constraints.txt -r requirements_test.txt
          uv pip install --prerelease=allow --constraint=.github/workflows/constraints.txt -e .
          uv pip install --prerelease=allow --constraint=.github/workflows/constraints.txt mypy
      - name: Mypy
        # Modules with known errors are listed in [[tool.mypy.overrides]]
        # (ratchet); everything else, new modules included, must pass.
        run: mypy custom_components/sberhome

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        # CI-only tool pins live in .github/workflows/constraints.txt.
        # xdist / timeout are CI-only conveniences, not in requirements_test.txt.
        # --prerelease=allow: pytest-homeassistant-custom-component pulls
        # aiohasupervisor as a pre-release; uv refuses by default.
        run: |
          uv pip install --prerelease=allow --constraint=.github/workflows/constraints.txt -r requirements_test.txt
          uv pip install --prerelease=allow --constraint=.github/workflows/constraints.txt -e .
          uv pip install --prerelease=allow --constraint=.github/workflows/constraints.txt \
            pytest-xdist pytest-timeout
      - name: Run tests
        # -n auto      parallel across CPU cores (~3× on GitHub runners)
        # --timeout    kills hung tests instead of timing out the whole job
        # --durations  surfaces the slowest 10 tests every run
        # Coverage floor: pytest-cov applies fail_under from
        # [tool.coverage.report] in pyproject.toml and fails the job below it.
        run: |
          pytest tests/ \
            -n auto \
            --timeout=30 \
            --durations=10
