refresh:
  name: Принудительное обновление state
  description: >
    Запросить свежий state всех устройств из Sber Gateway (REST poll) и
    перечитать настройки колонок (эквалайзер/режимы канала /v18). Полезно
    в автоматизациях перед чтением датчиков и чтобы подтянуть правки,
    сделанные в приложении Сбера.

send_raw_command:
  name: Send raw desired_state (debug)
  description: >
    Отправить произвольный `desired_state` list в Sber API. Debug-инструмент
    для экспериментов с serialized format. Возвращает sent payload в response.
  fields:
    device_id:
      name: Device ID
      description: Sber device_id (из панели Диагностика).
      required: true
      selector:
        text:
    state:
      name: Desired state
      description: >
        Список AttributeValueDto в serialized format.
        Пример: [{"key":"on_off","type":"BOOL","bool_value":true},
        {"key":"light_colour","type":"COLOR","color_value":{"hue":120,"saturation":100,"brightness":50}}]
      required: true
      selector:
        object:

send_custom_key:
  name: Send custom key
  description: Send a custom key press to a SberHome media player (TV).
  target:
    entity:
      integration: sberhome
      domain: media_player
  fields:
    key:
      name: Key
      description: Which key to send.
      required: true
      selector:
        select:
          options:
            - "confirm"
            - "back"
            - "home"

send_direction:
  name: Send direction
  description: Send a D-pad direction to a SberHome media player (TV).
  target:
    entity:
      integration: sberhome
      domain: media_player
  fields:
    direction:
      name: Direction
      description: Navigation direction.
      required: true
      selector:
        select:
          options:
            - "up"
            - "down"
            - "left"
            - "right"

play_channel:
  name: Play channel
  description: Switch to a specific channel number on a SberHome TV.
  target:
    entity:
      integration: sberhome
      domain: media_player
  fields:
    channel:
      name: Channel
      description: Channel number to switch to.
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box

tts_send:
  name: Озвучить текст (TTS surrogate)
  description: >
    Озвучить `message` на колонках Sber через TTS-суррогат. Обходит строгую
    схему `notify.send_message` (HA 2023.7+ не пропускает `device_ids` внутри
    `data`): здесь `device_ids` — обычный параметр сервиса. По умолчанию
    озвучиваются все колонки дома.
  fields:
    message:
      name: Message
      description: Текст для озвучивания. Поддерживает Jinja2-шаблоны.
      required: true
      selector:
        text:
    device_ids:
      name: Device IDs
      description: >
        Список raw Sber UUID колонок. По умолчанию (пусто) — все колонки
        дома.
      required: false
      selector:
        object:
