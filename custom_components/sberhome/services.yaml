# Названия и описания сервисов и полей — в strings.json / translations
# (раздел "services"), здесь только схема полей для UI.

refresh:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sberhome

send_raw_command:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sberhome
    device_id:
      required: true
      selector:
        text:
    state:
      required: true
      # Пример — здесь, а не в описании поля: фигурные скобки JSON в
      # strings.json hassfest принимает за плейсхолдеры перевода.
      example: '[{"key": "on_off", "type": "BOOL", "bool_value": true}]'
      selector:
        object:

reload_intents:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sberhome

send_custom_key:
  target:
    entity:
      integration: sberhome
      domain: media_player
  fields:
    key:
      required: true
      selector:
        select:
          options:
            - "confirm"
            - "back"
            - "home"

send_direction:
  target:
    entity:
      integration: sberhome
      domain: media_player
  fields:
    direction:
      required: true
      selector:
        select:
          options:
            - "up"
            - "down"
            - "left"
            - "right"

play_channel:
  target:
    entity:
      integration: sberhome
      domain: media_player
  fields:
    channel:
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box

tts_send:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sberhome
    message:
      required: true
      selector:
        text:
    device_ids:
      required: false
      selector:
        object:

ttc_send:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: sberhome
    message:
      required: true
      selector:
        text:
    device_ids:
      required: false
      selector:
        object:
