rules:
  # Статусы сверены с кодом 2026-09-15. done — правило выполнено целиком,
  # exempt — правило к интеграции не применимо (причина в comment),
  # todo — выполнено не полностью или не выполнено (чего не хватает — в comment).
  # Список правил сверен с hassfest Home Assistant 2026.9.1
  # (script/hassfest/quality_scale.py, 54 правила, включая docs-conditions и
  # docs-triggers уровня Bronze).
  # Все правила Bronze и Silver — done или exempt, поэтому в manifest.json
  # quality_scale: silver. До Gold не хватает dynamic-devices,
  # entity-translations, exception-translations, icon-translations и
  # reconfiguration-flow.

  # ---------------------------------------------------------------------------
  # Bronze
  # ---------------------------------------------------------------------------
  action-setup:
    status: done
    comment: Действия refresh, send_raw_command, reload_intents, tts_send и
      ttc_send регистрируются в async_setup (__init__.py,
      _async_register_services) и при отсутствующей или незагруженной записи
      поднимают ServiceValidationError. Сущностные send_custom_key,
      send_direction и play_channel регистрирует платформа media_player.py —
      так же, как в интеграциях ядра с этим правилом в done (например heos).
  appropriate-polling:
    status: done
    comment: Опрос координатора по умолчанию раз в 30 с (const.py,
      DEFAULT_SCAN_INTERVAL, в настройках 10–3600 с); пока WebSocket подключён —
      раз в 10 минут. Сценарии (5 минут), прошивки, хабы и индикатор (час)
      опрашиваются отдельно. После HTTP 429 опрос откладывается по Retry-After.
  brands:
    status: done
    comment: Иконки в custom_components/sberhome/brand/ (icon.png,
      icon@2x.png) — с Home Assistant 2026.3 пользовательские интеграции
      поставляют их сами, папка custom_integrations в home-assistant/brands
      устаревшая. Проверка HACS (.github/workflows/hacs.yml) проходит.
  common-modules:
    status: done
    comment: Координатор — coordinator.py (SberHomeCoordinator), базовая
      сущность — entity.py (SberBaseEntity).
  config-flow:
    status: done
    comment: Настройка через интерфейс (Сбер ID и SMS). У всех полей форм —
      data_description в strings.json и во всех переводах (sms_phone.phone,
      sms_otp.otp и resend, поля формы параметров). Токены — в entry.data,
      интервал опроса, буферы DevTools, таймаут команд и выбор устройств — в
      entry.options.
  config-flow-test-coverage:
    status: done
    comment: config_flow.py покрыт на 100% (полный прогон 2026-09-15) —
      Сбер ID и SMS, ошибки и повтор после них, reauth с чужим аккаунтом,
      форма параметров.
  dependency-transparency:
    status: done
    comment: Зависимости из manifest.json (httpx, websockets) — открытые пакеты
      на PyPI с публичными репозиториями и тегами релизов. Клиент API Сбера
      (aiosber) встроен в пакет интеграции и отдельно не публикуется.
  docs-actions:
    status: done
    comment: USAGE.md, «Сервисы HA» (refresh, reload_intents, send_raw_command) и
      «Телевизоры (tv)» (send_custom_key, send_direction, play_channel);
      README.md, «Выбор колонок» (tts_send, ttc_send).
  docs-conditions:
    status: exempt
    comment: Интеграция не регистрирует собственных условий автоматизаций (нет
      платформ condition.py и device_condition.py). В условиях используются
      стандартные условия по состоянию её сущностей.
  docs-high-level-description:
    status: done
    comment: README.md — вступление и «Как это работает».
  docs-installation-instructions:
    status: done
    comment: README.md, «Установка» (HACS и вручную) и «Настройка».
  docs-removal-instructions:
    status: done
    comment: README.md, «Удаление» — шаги удаления записи и файлов, что
      удаляется в Home Assistant и что остаётся в облаке Сбера (устройства,
      сценарии-заготовки TTS/TTC, голосовые команды).
  docs-triggers:
    status: exempt
    comment: Интеграция не регистрирует собственных триггеров автоматизаций (нет
      платформ trigger.py и device_trigger.py). Автоматизации запускаются
      стандартными триггерами — по состоянию её сущностей, в том числе
      сущностей event, и по событию sberhome_intent (USAGE.md,
      «HA events — sberhome_intent»).
  entity-event-setup:
    status: done
    comment: Подписки на события оформляются в async_added_to_hass через
      async_on_remove (event.py).
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: _attr_has_entity_name = True у всех классов сущностей.
  runtime-data:
    status: done
    comment: entry.runtime_data = coordinator, тип SberHomeConfigEntry
      (__init__.py, модули платформ, diagnostics.py).
  test-before-configure:
    status: done
    comment: Оба способа входа до создания или обновления записи получают
      токен умного дома и запрашивают список домов у шлюза
      (config_flow.py, _async_probe_gateway); ошибка показывается в форме
      (cannot_connect, invalid_auth, unknown) и шаг можно повторить.
  test-before-setup:
    status: done
    comment: async_setup_entry вызывает async_config_entry_first_refresh.
      Ошибки авторизации дают ConfigEntryAuthFailed, сетевые и ошибки API —
      UpdateFailed (HA превращает в ConfigEntryNotReady); без токенов
      SMS-входа — ConfigEntryAuthFailed. При любой ошибке настройка
      откатывается (_async_abort_setup) — платформы, координатор, hass.data.
  unique-config-entry:
    status: done
    comment: В manifest.json single_config_entry — вторую запись Home Assistant
      добавить не даёт. unique_id (sub из id_token или csafront:<телефон>)
      используется для проверки аккаунта при повторном входе; если sub в
      id_token нет, unique_id не ставится (config_flow.py, _extract_sub).

  # ---------------------------------------------------------------------------
  # Silver
  # ---------------------------------------------------------------------------
  action-exceptions:
    status: done
    comment: Действия сущностей переводят ошибки облака в HomeAssistantError
      (action_errors.py). Сервисы refresh, send_raw_command, reload_intents,
      tts_send и ttc_send поднимают ServiceValidationError при неверном вводе
      или незагруженной записи и HomeAssistantError при сбое облака.
  config-entry-unloading:
    status: done
    comment: async_unload_entry выгружает платформы и останавливает координатор
      (HTTP-клиент, WebSocket, фоновые задачи).
  docs-configuration-parameters:
    status: done
    comment: README.md, «Параметры интеграции» — scan_interval (30, 10–3600 с),
      devtools_buffer_size (200, 10–5000), command_timeout (10, 1–120 с) с
      назначением каждого; USAGE.md ссылается туда.
  docs-installation-parameters:
    status: done
    comment: README.md, «Настройка» — вход через Сбер ID (адрес companionapp://)
      и по SMS (формат номера, код, «Отправить новый код»), какие токены
      сохраняются и где.
  entity-unavailable:
    status: done
    comment: SberBaseEntity.available учитывает успех опроса координатора,
      наличие устройства в state_cache и reported_state["online"] (entity.py);
      сценарии, группы, присутствие, индикатор, настройки колонок и notify
      (notify.py, _SberHomeNotifyBase — ещё и наличие дома) — на
      CoordinatorEntity.
  integration-owner:
    status: done
    comment: codeowners в manifest.json.
  log-when-unavailable:
    status: done
    comment: Одно WARNING при потере связи и одно INFO при восстановлении, между
      ними — DEBUG (coordinator.py, _mark_poll_unavailable,
      _mark_poll_recovered); так же для WebSocket и серии ответов 429.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES задан во всех 16 модулях платформ — 0 у
      sensor, binary_sensor, event и update (данные от координатора, действий
      нет), 1 у платформ с действиями (команды уходят в облако по одной).
  reauthentication-flow:
    status: done
    comment: async_step_reauth в config_flow.py, для Сбер ID и для SMS; вход в
      чужой аккаунт отклоняется (wrong_account).
  test-coverage:
    status: done
    comment: Полный прогон 2026-09-15 — 2779 тестов, общее покрытие 99.2%
      (fail_under = 99 в pyproject.toml), каждый модуль — не ниже 95%.

  # ---------------------------------------------------------------------------
  # Gold
  # ---------------------------------------------------------------------------
  devices:
    status: done
    comment: DeviceInfo с производителем, моделью, версией прошивки, серийным
      номером и комнатой (entity.py).
  diagnostics:
    status: done
    comment: diagnostics.py включает entry (redacted, в т.ч. токены SMS-входа),
      auth state, coordinator stats, devices summary с entities и недавние
      данные DevTools (журнал, изменения, команды, проверка) с маскировкой.
  discovery:
    status: exempt
    comment: Настройка — это вход в аккаунт облака Сбера. Обнаружение устройства
      в локальной сети не даёт данных для настройки, сетевые адреса интеграция
      не использует.
  discovery-update-info:
    status: exempt
    comment: Сетевых адресов устройств интеграция не хранит — обновлять нечего.
  docs-data-update:
    status: done
    comment: README.md, «Как это работает», «Возможности» (адаптивный опрос) и
      «Параметры интеграции»; USAGE.md, «Введение».
  docs-examples:
    status: done
    comment: Примеры автоматизаций в README.md и USAGE.md.
  docs-known-limitations:
    status: done
    comment: README.md, «Известные ограничения» (неофициальный API, только
      облако, один аккаунт, SMS-вход без настроек колонок, появление новых
      сущностей после перезагрузки записи), «Лимиты» (TTS); USAGE.md —
      «Ограничения» (TTS), ограничения слушателей.
  docs-supported-devices:
    status: done
    comment: README.md, «Поддерживаемые устройства (полный список)».
  docs-supported-functions:
    status: done
    comment: README.md, «Типы сущностей в Home Assistant»; USAGE.md, справочник
      сущностей по категориям.
  docs-troubleshooting:
    status: done
    comment: README.md, «Решение проблем» — симптомы и шаги по ошибкам входа,
      Repairs-замечаниям (update_failing, background_poll_disabled,
      conflicting_integration, multiple_config_entries), записям журнала о
      недоступности облака, WebSocket и 429, сетевым хостам.
  docs-use-cases:
    status: done
    comment: README.md, разделы «Use-case» (голосовые команды, TTS, TTC).
  dynamic-devices:
    status: todo
    comment: Платформы создают сущности только в async_setup_entry (например
      sensor.py). Устройства, сценарии и группы, появившиеся позже, добавляются
      только после перезагрузки записи.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: todo
    comment: Сущности устройств называются через translation_key (entity.py),
      но часть имён задана в коде по-английски — update.py («Firmware»),
      light.py («LED indicator»), switch.py и binary_sensor.py («At home»),
      notify.py («Sber TTS», «Sber TTC»), switch_groups.py («Sber group»); у
      настроек колонок — русские суффиксы в
      sbermap/transform/staros_settings.py.
  exception-translations:
    status: todo
    comment: HomeAssistantError и ServiceValidationError в действиях и
      сервисах поднимаются с translation_key (секция exceptions в
      strings.json). Но UpdateFailed и ConfigEntryAuthFailed координатора
      (coordinator.py) и ConfigEntryAuthFailed в __init__.py
      (_create_coordinator) — с английским текстом без перевода; текст
      UpdateFailed Home Assistant показывает при повторе настройки записи.
  icon-translations:
    status: todo
    comment: icons.json нет. Иконки заданы в коде через _attr_icon (button.py,
      event.py, sensor.py, light.py, update.py, switch.py, binary_sensor.py) и
      через icon в sbermap/transform/feature_specs.py.
  reconfiguration-flow:
    status: todo
    comment: async_step_reconfigure нет — сменить способ входа (Сбер ID или SMS)
      можно только удалив и заново добавив запись.
  repair-issues:
    status: done
    comment: conflicting_integration, update_failing, background_poll_disabled,
      несколько записей SberHome (conflict.py, repairs.py, single_entry.py).
  stale-devices:
    status: done
    comment: registry_maintenance.prune_stale_devices удаляет устройства после
      PRUNE_MIN_CONSECUTIVE_MISSES пропусков в выдаче Sber API.

  # ---------------------------------------------------------------------------
  # Platinum
  # ---------------------------------------------------------------------------
  async-dependency:
    status: done
    comment: httpx и websockets асинхронные, встроенный клиент aiosber написан на
      asyncio.
  inject-websession:
    status: todo
    comment: WebSocket идёт через общую сессию aiohttp Home Assistant
      (coordinator.py, _run_ws). REST — через собственный httpx.AsyncClient
      (__init__.py async_setup_entry, config_flow.py) — нужен корневой
      сертификат Russian Trusted Root CA, а общий httpx-клиент Home Assistant
      свой SSL-контекст не принимает.
  strict-typing:
    status: todo
    comment: mypy (без --strict) проверяется в CI, но 25 модулей с известными
      ошибками пока исключены списком в pyproject.toml. Список сокращаем
      по мере вычистки, затем — переход к --strict.
